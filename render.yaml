# ==============================================================================
# MIRACLE — Render Blueprint Specification (render.yaml)
# Free-Tier Architecture:
#   1. Backend:  FastAPI Web Service (Python 3.11, Uvicorn, health check at /health)
#   2. Frontend: React + Vite Static Site (SPA rewrite rule /* -> /index.html)
# ==============================================================================

services:
  # ── 1. Backend Web Service ───────────────────────────────────────────────────
  - type: web
    name: miracle-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PASSWORD_HASHING_SCHEME
        value: argon2id
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 10
      - key: DB_POOL_RECYCLE
        value: 1800

  # ── 2. Frontend Static Site ──────────────────────────────────────────────────
  - type: static
    name: miracle-frontend
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    publishPath: dist
    autoDeploy: true
    routes:
      # SPA rewrite rule: all client paths route to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
